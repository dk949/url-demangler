<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL demangler</title>
  <script type="module" src="/src/main.ts" defer></script>
  <link href="/src/style.css" rel="stylesheet">
</head>

<body class="
             min-h-screen
             bg-slate-200 text-slate-900
             dark:bg-slate-900 dark:text-slate-200
  p-8 ">
  <div class="max-w-2xl mx-auto space-y-6">
    <h1 class="text-4xl font-bold text-center pt-12 pb-4">URL demangler</h1>

    <div class="space-y-4">
      <div class="flex gap-2">
        <input id="urlInput" type="url" placeholder="Enter URL here" class="
        flex-1 p-2
        border-2 border-slate-300 rounded-md
        focus:outline-hidden focus:border-amber-500">
        <button id="goBtn" type="button" class="
                    px-4 py-2
                    rounded-md
                    bg-amber-500 text-white
                    hover:bg-amber-600
                    active:bg-amber-200 active:text-slate-900
                    transition-colors
                    cursor-pointer
          ">
          Go
        </button>
      </div>

      <div id="output" class="font-mono p-2 break-words">Enter URL above</div>

      <div class="flex gap-2 flex-col sm:flex-row">
        <button id="pasteBtn" type="button" class="
          px-4 py-2
          rounded-md
          bg-slate-300 dark:bg-slate-600
          hover:bg-slate-400 hover:dark:bg-slate-700
          active:bg-slate-100 active:text-slate-900
          transition-colors
          cursor-pointer
          ">
          Paste from clipboard
        </button>
        <button id="copyBtn" type="button" disabled class="
          px-4 py-2
          rounded-md
          bg-amber-500 text-white
          hover:bg-amber-600
          active:bg-amber-200 active:text-slate-900
          disabled:bg-amber-100 disabled:hover:bg-amber-100 disabled:text-slate-900/50
          transition-colors
          cursor-pointer disabled:cursor-not-allowed
          ">
          Copy to clipboard
        </button>
        <button id="resetBtn" type="button" class="
          px-4 py-2
          rounded-md
          bg-red-500 text-white
          hover:bg-red-700
          active:bg-red-200 active:text-slate-900
          transition-colors
          cursor-pointer
          ">
          Reset
        </button>

        <a href="https://github.com/dk949/url-demangler" target="_blank" class="
                        ms-0 mt-12 sm:ms-auto  sm:mt-0
                        pe-4 pl-2 py-2
                        rounded-md
                        bg-[#096BDE]
                        hover:bg-[#140FFF]
                        active:bg-[#6BD6D0]
                        flex
                        ">


          <div class="flex gap-2 mx-auto">
            <img src="/github-mark.svg" class="h-[1lh] align-bottom">
            Source
          </div>

        </a>
      </div>
    </div>
  </div>
</body>

</html>
